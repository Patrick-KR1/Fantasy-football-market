name: Audit previous-season fixture scope
on:
  push:
    branches: ['fix/regular-season-scope-20261030']
    paths: ['.github/workflows/valuation-scope-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/audit-reference-scope.mjs
      - name: Prepare and verify the corrected reference without publishing it
        run: node --import tsx scripts/rebuild-reference-scope.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regular-reference-audit
          path: |
            test-artifacts/scope-summary.json
            test-artifacts/scoped-reference.json.gz
          if-no-files-found: ignore
          retention-days: 7
