name: Recover verified valuation evidence
on:
  push:
    branches: [main]
    paths: ['.github/workflows/valuation-evidence-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' || github.repository == 'hyun1290/kick-x-test'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate unique historical identities without publishing prices
        run: node --conditions=react-server --import tsx scripts/repair-valuation-evidence.mjs --identity-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valuation-evidence-probe
          path: |
            test-artifacts/valuation-evidence-probe.json
            test-artifacts/valuation-recovery.json
            test-artifacts/identity-preview.json
          if-no-files-found: ignore
          retention-days: 7
