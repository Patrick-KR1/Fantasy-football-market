name: KICK-X checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    # Match the supported OS for the pinned Playwright browser package.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KICKX_DATABASE_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: kickx_test
      KICKX_BROWSER_MODULE: /tmp/kickx-browser
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kickx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build and type check
        run: npm run build
      - name: SQL migration and role isolation
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/database-bootstrap.sql
          for migration in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$migration"; done
          psql -v ON_ERROR_STOP=1 -c "update public.kickx_policy set club_competitions_enabled=false"
          # New members start with 1,000,000P; the SQL fixtures were written for the earlier 1,300,000P grant.
          test "$(psql -tA -c 'select initial_points from public.kickx_policy')" = "1000000"
          psql -v ON_ERROR_STOP=1 -c "update public.kickx_policy set initial_points=1300000"
          for test in tests/database-*.sql; do
            if [ "$test" != tests/database-bootstrap.sql ]; then psql -v ON_ERROR_STOP=1 -f "$test"; fi
          done
      - name: Browser test dependencies
        run: |
          npm install --prefix /tmp/kickx-browser --no-package-lock @playwright/test@1.56.1
          node /tmp/kickx-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Asset chart complete stroke on desktop and mobile
        run: node tests/asset-chart-browser.mjs
      - name: Market goal and assist card and list checks
        run: node tests/market-stats-browser.mjs
      - name: Squad price reveal pagination and replay checks
        run: node tests/price-reveal-browser.mjs
      - name: Roster bench desktop and mobile checks
        run: node tests/roster-bench-browser.mjs
      - name: Formation selection and placement desktop and mobile checks
        run: node tests/formations-browser.mjs
      - name: Desktop and mobile smoke tests
        run: node tests/browser-smoke.mjs
      - name: Community, notification and profile regression tests
        run: |
          node tests/community-activity-browser.mjs
          node tests/notifications-browser.mjs
          node tests/profile-report-browser.mjs
          node tests/browser-ui-errors.mjs
          node tests/squad-market-community-browser.mjs
          node tests/primary-polls-browser.mjs
          node tests/predictions-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kickx-browser-checks
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
